services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      # Datos de MySQL. Por defecto en la carpeta ./mysql-data del proyecto:
      # sobreviven a "docker compose down -v" y a reinicios.
      # Jenkins usa MYSQL_DATA_DIR=mysql_data (volumen temporal) para probar con BD limpia.
      - ${MYSQL_DATA_DIR:-./mysql-data}:/var/lib/mysql
      # Scripts iniciales: solo se ejecutan cuando la BD está vacía (primera vez)
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
